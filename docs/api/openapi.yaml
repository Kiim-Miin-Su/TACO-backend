openapi: 3.0.0
paths:
  /api/auth/signup:
    post:
      operationId: AuthController_signup
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupDto'
      responses:
        '201':
          description: ''
      summary: 가입 신청(대표 승인 대기). 인증 메일 발송.
      tags:
      - auth
  /api/auth/verify-email:
    get:
      operationId: AuthController_verifyEmail
      parameters:
      - name: token
        required: false
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
      summary: 이메일 인증(token) — hash 대조·48h 만료.
      tags:
      - auth
  /api/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
      summary: 로그인(비밀번호 해시 검증 + 상태 게이트 + rate limit). 성공/실패는 auth_events 기록.
      tags:
      - auth
  /api/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        '201':
          description: ''
      security:
      - bearer: []
      summary: 로그아웃 — auth_events 기록(토큰은 클라이언트가 폐기).
      tags:
      - auth
  /api/auth/pending:
    get:
      operationId: AuthController_pending
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      security:
      - bearer: []
      summary: 승인 대기 계정 목록(대표 전용).
      tags:
      - auth
  /api/auth/approve/{id}:
    post:
      operationId: AuthController_approve
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      security:
      - bearer: []
      summary: '가입 승인(원자 tx: 상태+승인메타+강사프로필+audit, 역할 지정 가능) — 대표 전용. 동시 결정은 409.'
      tags:
      - auth
  /api/auth/reject/{id}:
    post:
      operationId: AuthController_reject
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      security:
      - bearer: []
      summary: 가입 반려(사유 필수, audit 기록) — 대표 전용. 동시 결정은 409.
      tags:
      - auth
  /api/auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
