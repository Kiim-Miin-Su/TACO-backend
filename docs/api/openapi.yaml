openapi: 3.0.0
paths:
  /api/auth/signup-email-challenge:
    post:
      operationId: AuthController_createSignupEmailChallenge
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSignupEmailChallengeDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      summary: 가입 전 이메일 OTP 발송(공개) — 5회/분. 가입 여부와 무관하게 동일 응답(열거 방지).
      tags:
        - auth
      security: []
  /api/auth/signup-email-challenge/{id}/confirm:
    post:
      operationId: AuthController_confirmSignupEmailChallenge
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmSignupEmailChallengeDto'
      responses:
        '201':
          description: ''
      summary: 가입 전 이메일 OTP 확인(공개) — 10회/분, 실패 5회 잠금, 성공 시 verified.
      tags:
        - auth
      security: []
  /api/auth/web-id-available:
    get:
      operationId: AuthController_webIdAvailable
      parameters:
        - name: webId
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: 아이디 사용 가능 여부(공개) — {available}만 반환(이름·역할 미노출), 10회/분.
      tags:
        - auth
      security: []
  /api/auth/signup-phone-challenge:
    post:
      operationId: AuthController_createSignupPhoneChallenge
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSignupPhoneChallengeDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      summary: 가입 전 휴대전화 OTP 발송(공개) — 5회/분, 쿨다운 60초.
      tags:
        - auth
      security: []
  /api/auth/signup-phone-challenge/{id}/confirm:
    post:
      operationId: AuthController_confirmSignupPhoneChallenge
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmSignupPhoneChallengeDto'
      responses:
        '201':
          description: ''
      summary: 가입 전 휴대전화 OTP 확인(공개) — 10회/분, 실패 5회 잠금, 성공 시 verified.
      tags:
        - auth
      security: []
  /api/auth/signup-config:
    get:
      operationId: AuthController_signupConfig
      parameters: []
      responses:
        '200':
          description: ''
      summary: 가입 폼 구성(공개) — { phoneVerificationRequired } 단일 필드, 10회/분.
      tags:
        - auth
      security: []
  /api/auth/signup:
    post:
      operationId: AuthController_signup
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupDto'
      responses:
        '201':
          description: ''
      summary: 가입 신청(대표 승인 대기) — 이메일 OTP(+SENS 설정 시 휴대전화 OTP) 소비, emailVerified=true 생성.
      tags:
        - auth
      security: []
  /api/auth/verify-email:
    get:
      operationId: AuthController_verifyEmail
      parameters:
        - name: token
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      summary: 이메일 인증(token) — hash 대조·48h 만료. [잔존 계정 호환]
      tags:
        - auth
      security: []
  /api/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
      summary: 로그인(비밀번호 해시 검증 + 상태 게이트 + rate limit). 성공/실패는 auth_events 기록.
      tags:
        - auth
      security: []
  /api/auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      responses:
        '201':
          description: ''
      summary: access token 갱신 — refresh 쿠키 회전(재사용 감지 시 전 세션 무효). [쿠키]
      tags:
        - auth
      security: []
  /api/auth/recover-id:
    post:
      operationId: AuthController_recoverId
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverIdDto'
      responses:
        '201':
          description: ''
      summary: 아이디 찾기 — 가입 이메일이 일치하면 아이디를 메일로 안내(항상 동일 응답).
      tags:
        - auth
      security: []
  /api/auth/recover-password:
    post:
      operationId: AuthController_recoverPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverPasswordDto'
      responses:
        '201':
          description: ''
      summary: 비밀번호 재설정 요청 — 아이디+이메일이 일치하면 1시간 유효 링크 발송(항상 동일 응답).
      tags:
        - auth
      security: []
  /api/auth/reset-password:
    post:
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '201':
          description: ''
      summary: 비밀번호 재설정 확정 — 토큰 검증 후 변경. 성공 시 기존 세션 전부 무효(auth_version+1).
      tags:
        - auth
      security: []
  /api/auth/recovery-email-challenge:
    post:
      operationId: AuthController_createRecoveryEmailChallenge
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSignupEmailChallengeDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      summary: 복구용 이메일 OTP 발송(공개) — 5회/분. 가입 여부와 무관하게 동일 응답.
      tags:
        - auth
      security: []
  /api/auth/recovery-email-challenge/{id}/confirm:
    post:
      operationId: AuthController_confirmRecoveryEmailChallenge
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmSignupEmailChallengeDto'
      responses:
        '201':
          description: ''
      summary: 복구용 이메일 OTP 확인(공개) — 10회/분, 실패 5회 잠금, 성공 시 verified.
      tags:
        - auth
      security: []
  /api/auth/recover-id/complete:
    post:
      operationId: AuthController_completeRecoverId
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRecoverIdDto'
      responses:
        '201':
          description: ''
      summary: 아이디 찾기 완료(공개) — verified recovery OTP 일회 소비 후 webId 목록 반환.
      tags:
        - auth
      security: []
  /api/auth/reset-password-otp:
    post:
      operationId: AuthController_resetPasswordOtp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordOtpDto'
      responses:
        '201':
          description: ''
      summary: 비밀번호 재설정 확정(OTP·공개) — 성공 시 기존 세션 전부 무효(auth_version+1).
      tags:
        - auth
      security: []
  /api/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        '201':
          description: ''
      summary: 로그아웃 — access/refresh cookie 폐기·refresh row revoke + auth_events 기록.
      tags:
        - auth
      security: []
  /api/auth/reauth:
    post:
      operationId: AuthController_reauth
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
        - access_token: []
      summary: 비밀번호 재확인(로그인 상태) — 민감 화면·명령 게이트. 성공 시 10분 sudo 쿠키 발급(서버측 강제). 5회/분.
      tags:
        - auth
  /api/auth/pending:
    get:
      operationId: AuthController_pending
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAccountResponseDto'
      security:
        - bearer: []
        - access_token: []
      summary: 처리 가능한 승인 대기 계정 목록(매니저=강사, 관리자=강사·매니저, 대표=대표 외).
      tags:
        - auth
  /api/auth/approve/{id}:
    post:
      operationId: AuthController_approve
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccountResponseDto'
      security:
        - bearer: []
        - access_token: []
      summary: 가입 승인(요청 역할 보존, 역할별 범위 강제, 원자 tx+audit). 동시 결정은 409.
      tags:
        - auth
  /api/auth/pending/{id}/resend-verification:
    post:
      operationId: AuthController_resendPendingVerification
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      responses:
        '201':
          description: ''
      security:
        - bearer: []
        - access_token: []
      summary: 승인 대기 계정 인증 메일 재발송(새 48h 토큰) — 대표 전용. 미인증 pending만.
      tags:
        - auth
  /api/auth/reject/{id}:
    post:
      operationId: AuthController_reject
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccountResponseDto'
      security:
        - bearer: []
        - access_token: []
      summary: 가입 반려(역할별 범위 강제, 사유 필수, audit 기록). 동시 결정은 409.
      tags:
        - auth
  /api/auth/pending/{id}:
    delete:
      operationId: AuthController_deletePending
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectDto'
      responses:
        '200':
          description: ''
      security:
        - bearer: []
        - access_token: []
      summary: 가입 신청 삭제(pending·rejected만·재인증 필수) — 식별자 해제·RRN 파기·audit. 대표 전용, cookie 세션은 reauth 후 10분 내만 허용.
      tags:
        - auth
  /api/auth/events:
    get:
      operationId: AuthController_listAuthEvents
      parameters:
        - name: userId
          required: false
          in: query
          schema:
            minimum: 1
            type: number
        - name: eventType
          required: false
          in: query
          schema:
            type: string
            enum:
              - login_success
              - login_failure
              - logout
              - recover_id_requested
              - recover_id_completed
              - password_reset_requested
              - password_reset_completed
              - refresh_reuse_blocked
              - csrf_origin_blocked
        - name: success
          required: false
          in: query
          schema:
            type: boolean
        - name: from
          required: false
          in: query
          schema:
            type: string
        - name: to
          required: false
          in: query
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 500
            type: integer
            format: int32
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      security:
        - bearer: []
        - access_token: []
      summary: 인증 보안 이벤트 조회/검색(최대 200건) — 대표·관리자 재인증 필수, append-only.
      tags:
        - auth
  /api/auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: ''
      summary: 토큰 검증 → claims. [로그인]
      tags:
        - auth
      security:
        - bearer: []
        - access_token: []
  /api/users/me/profile:
    get:
      operationId: UsersController_profile
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponseDto'
      security:
        - bearer: []
        - access_token: []
      summary: 내 프로필 조회. [전 직원]
      tags:
        - Users
  /api/users/instructors:
    post:
      operationId: UsersController_createInstructor
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstructorDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      security:
        - bearer: []
        - access_token: []
      summary: >-
        강사 직접 등록(대표 전용·재인증 필수) — 즉시 active, users+instructor_profiles+audit 원자 tx. cookie 세션은 reauth 후 10분 내만 허용(403
        SUDO_REQUIRED).
      tags:
        - Users
  /api/users/exists:
    get:
      operationId: UsersController_exists
      parameters:
        - name: webId
          required: false
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      summary: 학생·보호자 연결용 Web ID 존재 여부 확인 [전 직원]
      tags:
        - Users
      security:
        - bearer: []
        - access_token: []
  /api/users:
    get:
      operationId: UsersController_list
      parameters:
        - name: includeTerminated
          required: false
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAccountResponseDto'
      summary: 직원 계정 목록과 승인 상태 조회 [매니저 이상]
      tags:
        - Users
      security:
        - bearer: []
        - access_token: []
  /api/users/{id}:
    get:
      operationId: UsersController_detail
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccountResponseDto'
      security:
        - bearer: []
        - access_token: []
      summary: 계정 상세(관리자) — super_admin에게만 rrnMasked 동봉.
      tags:
        - Users
    patch:
      operationId: UsersController_adminUpdate
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      security:
        - bearer: []
        - access_token: []
      summary: >-
        대표 직접 수정(재인증 필수) — name/phone/email/role. role·email 변경 시 대상 세션 전부 무효. super_admin 대상 400. cookie 세션은 reauth 후
        10분 내만 허용(403 SUDO_REQUIRED).
      tags:
        - Users
    delete:
      operationId: UsersController_terminate
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLifecycleDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      security:
        - bearer: []
        - access_token: []
      summary: 활성 직원 계정 종료(대표·재인증) — authVersion 증가, soft delete, 강사 프로필 전이, audit 원자 tx.
      tags:
        - Users
  /api/users/{id}/permissions:
    get:
      operationId: UsersController_permissions
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      security:
        - bearer: []
        - access_token: []
      summary: 사용자 유효 권한 projection — 역할 기본값+DB 개별 예외 [대표·관리자]
      tags:
        - Users
  /api/users/{id}/permissions/{capability}:
    put:
      operationId: UsersController_setPermission
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
        - name: capability
          required: true
          in: path
          description: contracts RoleCapability
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserCapabilityDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      security:
        - bearer: []
        - access_token: []
      summary: 사용자 권한 허용·제한·역할 기본값 복원 — 사유·재인증·감사·원자 transaction [대표·관리자]
      tags:
        - Users
  /api/users/{id}/restore:
    post:
      operationId: UsersController_restore
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLifecycleDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      security:
        - bearer: []
        - access_token: []
      summary: 종료된 직원 계정 복구(대표·재인증) — authVersion 증가, 강사 프로필 복구, audit 원자 tx.
      tags:
        - Users
  /api/instructors:
    get:
      operationId: InstructorsController_list
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      security:
