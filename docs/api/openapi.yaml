              schema: { $ref: '#/components/schemas/AvailabilityBlock' }
  /availability/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    delete:
      tags: [availability]
      summary: 가용 블록 삭제
      operationId: deleteAvailability
      x-status: planned
      x-roles: [instructor, manager, admin, super_admin]
      responses:
        '204': { description: 삭제됨 }

  # ════════════════════════════ scheduling engine (v5) ════════════════════════════
  /schedule/conflicts:
    post:
      tags: [scheduling]
      summary: 충돌 검사(생성·이동 전)
      description: 후보 세션이 강사·강의실·학생 이중예약·불가시간·capacity와 충돌하는지 검사.
      operationId: checkConflicts
      x-status: planned
      x-roles: [manager, admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConflictCheckInput' }
      responses:
        '200':
          description: 충돌 목록(빈 배열=충돌 없음)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Conflict' } }
  /schedule/suggest-slots:
    post:
      tags: [scheduling]
      summary: 가능 시간 슬롯 추천(학생가용 ∩ 강사가용 − 점유)
      operationId: suggestSlots
      x-status: planned
      x-roles: [manager, admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuggestSlotsInput' }
      responses:
        '200':
          description: 주별 후보 슬롯
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SlotCandidate' } }
  /instructors/{id}/schedule:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [scheduling]
      summary: 강사 개인 스케줄(기간)
      operationId: getInstructorSchedule
      x-status: planned
      x-roles: [instructor, manager, admin, super_admin]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ClassSession' } }
  /students/{id}/schedule:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [scheduling]
      summary: 학생 개인 스케줄(기간)
      operationId: getStudentSchedule
      x-status: planned
      x-roles: [student, parent, instructor, manager, admin, super_admin]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ClassSession' } }
  /reports/teaching-hours:
    get:
      tags: [scheduling]
      summary: 시수 집계(기간·강사·학생) — 회계 입력
      operationId: teachingHours
      x-status: planned
      x-roles: [manager, admin, super_admin]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: instructorId, in: query, schema: { type: integer } }
        - { name: studentId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeachingHours' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Page:
      name: page
      in: query
      description: 1-base 페이지 번호(planned)
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      description: 페이지 크기(planned)
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Q:
      name: q
      in: query
      description: 검색어(planned)
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: '정렬. 예: name,-createdAt (planned)'
      schema: { type: string }

  responses:
    BadRequest:
      description: 잘못된 요청(검증 실패)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 인증 필요/실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 권한 없음(역할 불충분)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ── 공통/에러 ──
    Error:
      type: object
      description: NestJS 기본 예외 형상
      properties:
        statusCode: { type: integer, example: 400 }
        message:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        error: { type: string, example: Bad Request }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }

    # ── enums(계약과 동일) ──
    StudentStatus: { type: string, enum: [lead, active, paused, completed, canceled] }
    ResidenceType: { type: string, enum: [domestic, overseas] }
    EnrollmentStatus: { type: string, enum: [active, paused, completed, canceled] }
    SessionStatus: { type: string, enum: [scheduled, held, canceled, no_show, makeup] }
    AttendanceStatus: { type: string, enum: [present, late, absent, excused] }
    ReportStatus: { type: string, enum: [draft, submitted, sent] }
    PaymentStatus: { type: string, enum: [pending, paid, overdue, refunded, partial_refund] }
    PaymentMethod: { type: string, enum: [card, transfer, cash, point, etc] }
    ApprovalStatus: { type: string, enum: [requested, approved, rejected] }
    PayoutStatus: { type: string, enum: [pending, confirmed, paid] }
    ExpenseCategory: { type: string, enum: [supplies, equipment, books, rent, utility, marketing, meal, etc] }
    EventType: { type: string, enum: [notice, exam, holiday, closure, event] }
    EventPriority: { type: string, enum: [low, normal, high] }
    CounselStatus: { type: string, enum: [requested, pending, registered, dropped] }
    CounselSource: { type: string, enum: [internal_form, naver_form, google_form, manual, etc] }
    CounselResult: { type: string, enum: [positive, neutral, negative, no_response, registered] }
    AccountRole: { type: string, enum: [student, parent, instructor, manager, admin, super_admin] }
    RecurrenceScope:
      type: string
      enum: [this, this_and_following, all]
      description: 시리즈 편집 적용 범위(구글 캘린더식)

    # ── account/auth ──
    Account:
      type: object
      properties:
        id: { type: integer }
        webId: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/AccountRole' }
    WebIdCheckResult:
      type: object
      properties:
        webId: { type: string }
        exists: { type: boolean }
        name: { type: string }
        role: { $ref: '#/components/schemas/AccountRole' }
    IssueTokenInput:
      type: object
      required: [webId]
      properties:
        webId: { type: string, example: sophia_kim }

    # ── people ──
    Student:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer }
        name: { type: string }
        englishName: { type: string }
        grade: { type: integer }
        phone: { type: string }
        status: { $ref: '#/components/schemas/StudentStatus' }
        schoolName: { type: string }
        residenceType: { $ref: '#/components/schemas/ResidenceType' }
        memo: { type: string }
        webId: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    StudentDetail:
      allOf:
        - { $ref: '#/components/schemas/Student' }
        - type: object
          properties:
            enrollments: { type: array, items: { $ref: '#/components/schemas/Enrollment' } }
            parents: { type: array, items: { $ref: '#/components/schemas/Parent' } }
            counselForms: { type: array, items: { $ref: '#/components/schemas/CounselForm' } }
    StudentPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Student' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Parent:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        kakaoAvailable: { type: boolean }
        webId: { type: string }
    Instructor:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        subjectName: { type: string }

    # ── catalog ──
    Subject:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
    Course:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        subjectId: { type: integer }
        instructorId: { type: integer }
        price: { type: integer }
        hourlyRate: { type: integer }
    Roadmap:
      type: object
      description: '(예정) 코스 묶음. 코스·과목·강사 M:N.'
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        targetGrade: { type: integer }
        isActive: { type: boolean }
    RoadmapDetail:
      allOf:
        - { $ref: '#/components/schemas/Roadmap' }
        - type: object
          properties:
            courses:
              type: array
              items:
                type: object
                properties:
                  courseId: { type: integer }
                  sortOrder: { type: integer }

    # ── enrollment ──
    Enrollment:
      type: object
      properties:
        id: { type: integer }
        studentId: { type: integer }
        courseId: { type: integer }
        roadmapId: { type: integer }
        status: { $ref: '#/components/schemas/EnrollmentStatus' }
        totalSessions: { type: integer }
        completedSessions: { type: integer }
        enrolledAt: { type: string }

    # ── session/attendance/report ──
    ClassSession:
      type: object
      properties:
        id: { type: integer }
        seriesId: { type: integer, description: '(예정) 반복 시리즈 묶음 id' }
        courseId: { type: integer }
        instructorId: { type: integer }
        roomId: { type: integer, description: '강의실(스케줄 v5)' }
        sessionDate: { type: string, format: date }
        startTime: { type: string, description: 'HH:mm 시작 시각(주간 캘린더)' }
        endTime: { type: string, description: 'HH:mm 종료(=start+duration 파생 가능)' }
        durationMinutes: { type: integer }
        status: { $ref: '#/components/schemas/SessionStatus' }
        topic: { type: string }
    Attendance:
      type: object
      properties:
        id: { type: integer }
        sessionId: { type: integer }
        studentId: { type: integer }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
    SessionReport:
      type: object
      properties:
        id: { type: integer }
        sessionId: { type: integer }
        studentId: { type: integer }
        instructorId: { type: integer }
        content: { type: string }
        homework: { type: string }
        status: { $ref: '#/components/schemas/ReportStatus' }

    # ── counsel ──
    CounselForm:
      type: object
      properties:
        id: { type: integer }
        applicantName: { type: string }
        applicantPhone: { type: string }
        parentId: { type: integer }
        studentId: { type: integer }
        assignedStaffId: { type: integer }
        status: { $ref: '#/components/schemas/CounselStatus' }
        source: { $ref: '#/components/schemas/CounselSource' }
        interestSubjectId: { type: integer }
        interestCourseId: { type: integer }
        academyExpectation: { type: string }
        weakness: { type: string }
        createdAt: { type: string }
    CounselRound:
      type: object
      properties:
        id: { type: integer }
        counselFormId: { type: integer }
        roundNo: { type: integer }
        counselorId: { type: integer }
        completedAt: { type: string }
        isCompleted: { type: boolean }
        summary: { type: string }
        detail: { type: string }
        result: { $ref: '#/components/schemas/CounselResult' }
        nextAction: { type: string }
        nextContactAt: { type: string }
    CounselDetail:
      allOf:
        - { $ref: '#/components/schemas/CounselForm' }
        - type: object
          properties:
            rounds: { type: array, items: { $ref: '#/components/schemas/CounselRound' } }
    CounselPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CounselForm' } }
        meta: { $ref: '#/components/schemas/PageMeta' }

    # ── finance ──
    Payment:
      type: object
      properties:
        id: { type: integer }
        enrollmentId: { type: integer }
        studentId: { type: integer }
        payerParentId: { type: integer }
        amount: { type: integer }
        paidAmount: { type: integer }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        dueAt: { type: string, format: date }
        paidAt: { type: string, format: date }
        memo: { type: string }
        createdAt: { type: string, description: 등록일(청구 생성일) }
    PaymentPage:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Payment' } }
        meta: { $ref: '#/components/schemas/PageMeta' }
    Transaction:
      type: object
      properties:
        id: { type: integer }
        direction: { type: string, enum: [in, out] }
        category: { type: string }
        label: { type: string }
        amount: { type: integer }
        method: { type: string }
        occurredAt: { type: string, format: date }
    Expense:
      type: object
      properties:
        id: { type: integer }
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        title: { type: string }
        amount: { type: integer }
        spentAt: { type: string, format: date }
        vendor: { type: string }
        memo: { type: string }
        receiptUrl: { type: string }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
    InstructorPayout:
      type: object
      properties:
        id: { type: integer }
        instructorId: { type: integer }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        sessionCount: { type: integer }
        totalMinutes: { type: integer }
        amount: { type: integer }
        status: { $ref: '#/components/schemas/PayoutStatus' }
        paidAt: { type: string, format: date }

    # ── event ──
    AcademyEvent:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        type: { $ref: '#/components/schemas/EventType' }
        priority: { $ref: '#/components/schemas/EventPriority' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        allDay: { type: boolean }
        memo: { type: string }

    # ── dashboard ──
    DashboardSummary:
      type: object
      properties:
        revenue: { type: integer, description: 입금 합계 }
        receivable: { type: integer, description: 미수금 }
        expense: { type: integer, description: 지출 합계 }
        payout: { type: integer, description: 강사 페이 합계 }
        net: { type: integer, description: 순익 }

    # ════════ 요청(Create/Update) payload — @kms545487/contracts 와 일치 ════════
    CreateStudentInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        englishName: { type: string }
        phone: { type: string }
        grade: { type: integer }
        schoolName: { type: string }
        residenceType: { $ref: '#/components/schemas/ResidenceType' }
        status: { $ref: '#/components/schemas/StudentStatus' }
        memo: { type: string }
        webId: { type: string }
    UpdateStudentInput:
      type: object
      description: 부분 수정(모든 필드 optional)
      properties:
        name: { type: string }
        englishName: { type: string }
        phone: { type: string }
        grade: { type: integer }
        schoolName: { type: string }
        memo: { type: string }
        webId: { type: string }
        status: { $ref: '#/components/schemas/StudentStatus' }
    CreateParentInput:
      type: object
      required: [name, studentId]
      properties:
        name: { type: string }
        phone: { type: string }
        webId: { type: string }
        studentId: { type: integer }
        relation: { type: string }
        isPayer: { type: boolean }
        isPrimary: { type: boolean }
    CreateEnrollmentInput:
      type: object
      required: [studentId, courseId]
      properties:
        studentId: { type: integer }
        courseId: { type: integer }
        roadmapId: { type: integer }
        totalSessions: { type: integer }
        memo: { type: string }
    CreateSubjectInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    CreateCourseInput:
      type: object
      required: [name, subjectId, instructorId, price, hourlyRate]
      properties:
        name: { type: string }
        subjectId: { type: integer }
        instructorId: { type: integer }
        price: { type: integer }
        hourlyRate: { type: integer }
    CreateRoadmapInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        targetGrade: { type: integer }
        courseIds:
          type: array
          items: { type: integer }
          description: 연결할 코스(M:N, 순서대로)
    CreateClassSessionInput:
      type: object
      required: [courseId, instructorId, sessionDate, durationMinutes]
      properties:
        courseId: { type: integer }
        instructorId: { type: integer }
        roomId: { type: integer }
        sessionDate: { type: string, format: date }
        startTime: { type: string, description: 'HH:mm' }
        durationMinutes: { type: integer }
        topic: { type: string }
    CreateRecurringInput:
      type: object
      required: [courseId, instructorId, startDate, endDate, weekdays, durationMinutes]
      properties:
        courseId: { type: integer }
        instructorId: { type: integer }
        roomId: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        weekdays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          description: 0(일)~6(토)
        startTime: { type: string }
        durationMinutes: { type: integer }
        topic: { type: string }
    UpdateClassSessionInput:
      type: object
      properties:
        sessionDate: { type: string, format: date }
        startTime: { type: string }
        durationMinutes: { type: integer }
        topic: { type: string }
        status: { $ref: '#/components/schemas/SessionStatus' }
        scope: { $ref: '#/components/schemas/RecurrenceScope' }
    UpsertSessionReportInput:
      type: object
      required: [sessionId, studentId]
      properties:
        sessionId: { type: integer }
        studentId: { type: integer }
        content: { type: string }
        homework: { type: string }
    CreateCounselInput:
      type: object
      required: [applicantName, source]
      properties:
        applicantName: { type: string }
        applicantPhone: { type: string }
        source: { $ref: '#/components/schemas/CounselSource' }
        assignedStaffId: { type: integer }
        interestSubjectId: { type: integer }
        interestCourseId: { type: integer }
        academyExpectation: { type: string }
        desiredStartTime: { type: string, enum: [immediately, within_1_month, within_2_3_months, undecided] }
        learningAtmosphere: { type: string, enum: [self_directed, normal, needs_management] }
        studentIntention: { type: string, enum: [student_wants, parent_only, unknown] }
        weakness: { type: string }
    UpdateCounselInput:
      type: object
      properties:
        status: { $ref: '#/components/schemas/CounselStatus' }
        assignedStaffId: { type: integer }
        interestSubjectId: { type: integer }
        interestCourseId: { type: integer }
        academyExpectation: { type: string }
        weakness: { type: string }
    CreateCounselRoundInput:
      type: object
      properties:
        counselorId: { type: integer }
        summary: { type: string }
        detail: { type: string }
        result: { $ref: '#/components/schemas/CounselResult' }
        nextAction: { type: string }
        nextContactAt: { type: string }
    CreatePaymentInput:
      type: object
      required: [studentId, amount]
      properties:
        studentId: { type: integer }
        enrollmentId: { type: integer }
        payerParentId: { type: integer }
        amount: { type: integer }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        dueAt: { type: string, format: date, description: 납부 기한(청구 시 지정 가능) }
    UpdatePaymentInput:
      type: object
      properties:
        amount: { type: integer }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        dueAt: { type: string, format: date }
        memo: { type: string }
    CreateExpenseInput:
      type: object
      required: [category, title, amount, spentAt]
      properties:
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        title: { type: string }
        amount: { type: integer }
        spentAt: { type: string, format: date }
        vendor: { type: string }
        memo: { type: string }
        receiptUrl: { type: string }
    CreatePayoutInput:
      type: object
      required: [instructorId, periodStart, periodEnd]
      properties:
        instructorId: { type: integer }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        amount: { type: integer, description: 수동 보정 금액(미지정 시 자동 산정) }
    CreateEventInput:
      type: object
      required: [title, type, startDate, endDate]
      properties:
        title: { type: string }
        type: { $ref: '#/components/schemas/EventType' }
        priority: { $ref: '#/components/schemas/EventPriority' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        allDay: { type: boolean }
        memo: { type: string }

    # ════════ 스케줄 엔진 (v5) ════════
    AvailabilityOwner: { type: string, enum: [student, instructor, room] }
    AvailabilityKind: { type: string, enum: [available, unavailable] }
    ConflictType: { type: string, enum: [double_book, unavailable, room_capacity] }
    Room:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        buildingId: { type: integer, description: 상위 위치(건물) }
        capacity: { type: integer }
        color: { type: string }
        isActive: { type: boolean }
    CreateRoomInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        buildingId: { type: integer }
        capacity: { type: integer }
        color: { type: string }
        isActive: { type: boolean }
    AvailabilityBlock:
      type: object
      properties:
        id: { type: integer }
        ownerType: { $ref: '#/components/schemas/AvailabilityOwner' }
        ownerId: { type: integer }
        kind: { $ref: '#/components/schemas/AvailabilityKind' }
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0(일)~6(토) }
        startTime: { type: string, description: 'HH:mm' }
        endTime: { type: string, description: 'HH:mm' }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
    UpsertAvailabilityInput:
      type: object
      required: [ownerType, ownerId, weekday, startTime, endTime]
      properties:
        id: { type: integer, description: 있으면 수정, 없으면 생성 }
        ownerType: { $ref: '#/components/schemas/AvailabilityOwner' }
        ownerId: { type: integer }
        kind: { $ref: '#/components/schemas/AvailabilityKind' }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        startTime: { type: string }
        endTime: { type: string }
        effectiveFrom: { type: string, format: date }
        effectiveTo: { type: string, format: date }
    ConflictCheckInput:
      type: object
      required: [sessionDate, startTime, durationMinutes]
      properties:
        ignoreSessionId: { type: integer, description: 이동 시 자기 자신 제외 }
        instructorId: { type: integer }
        roomId: { type: integer }
        studentIds: { type: array, items: { type: integer } }
        sessionDate: { type: string, format: date }
        startTime: { type: string }
        durationMinutes: { type: integer }
    Conflict:
      type: object
      properties:
        type: { $ref: '#/components/schemas/ConflictType' }
        resource: { type: string, enum: [instructor, room, student] }
        resourceId: { type: integer }
        sessionId: { type: integer, description: 충돌 상대 세션(있으면) }
        detail: { type: string }
    SuggestSlotsInput:
      type: object
      required: [instructorId, studentIds, weekStart, weeks, durationMinutes]
      properties:
        instructorId: { type: integer }
        studentIds: { type: array, items: { type: integer } }
        roomId: { type: integer }
        weekStart: { type: string, format: date }
        weeks: { type: integer, minimum: 1 }
        durationMinutes: { type: integer }
        granularityMin: { type: integer, default: 30 }
    SlotCandidate:
      type: object
      properties:
        date: { type: string, format: date }
        weekday: { type: integer }
        startTime: { type: string }
        endTime: { type: string }
    TeachingHours:
      type: object
      properties:
        sessions: { type: integer, description: 대상 수업 수(held) }
        minutes: { type: integer, description: 총 시수(분) }
        hours: { type: number, description: 시간 환산 }
