info:
  title: TACO ERP API
  description: TnAcademy 백오피스 API (in-memory). 빌드 타임 생성 스펙.
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SignupDto:
      type: object
      properties:
        webId:
          type: string
          minLength: 3
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 100
        role:
          type: string
          enum:
          - instructor
          - manager
          - admin
      required:
      - webId
      - name
      - email
      - password
    LoginDto:
      type: object
      properties:
        webId:
          type: string
          maxLength: 50
        password:
          type: string
          maxLength: 100
      required:
      - webId
    LoginAccountResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 3
        name:
          type: string
          example: 김민수
        role:
          type: string
          enum:
          - super_admin
          - admin
          - manager
          - instructor
        mustChangePassword:
          type: boolean
          description: true면 계정 보안 변경 외 업무 API가 차단된다.
      required:
      - id
      - name
      - role
      - mustChangePassword
    LoginResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: Bearer access token
        account:
          $ref: '#/components/schemas/LoginAccountResponseDto'
      required:
      - accessToken
      - account
    ApproveDto:
      type: object
      properties:
        role:
          type: string
          enum:
          - instructor
          - manager
          - admin
          - super_admin
        reason:
          type: string
          maxLength: 500
    RejectDto:
      type: object
      properties:
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: 반려 사유(필수) — audit_log에 기록
      required:
      - reason
    ProfileResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 1
        webId:
          type: string
          example: park_inst
        name:
          type: string
          example: 박지훈
        email:
          type: string
          nullable: true
          example: park@tnacademy.test
        phone:
          type: string
          nullable: true
          example: +82-10-1234-5678
        countryCode:
          type: string
          nullable: true
          example: KR
        timeZone:
          type: string
          nullable: true
          example: Asia/Seoul
        role:
          type: string
          enum:
          - instructor
          - manager
          - admin
          - super_admin
        status:
          type: string
          enum:
          - pending
          - active
          - rejected
        profileVersion:
          type: number
          example: 1
          minimum: 1
      required:
      - id
      - webId
      - name
      - role
      - status
      - profileVersion
    CreateInstructorDto:
      type: object
      properties:
        webId:
          type: string
          minLength: 3
          maxLength: 50
          description: 로그인 아이디
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 이름
        password:
          type: string
          minLength: 8
          maxLength: 100
          description: 초기 비밀번호(8자+)
        email:
          type: string
          format: email
          description: 이메일(선택)
        phone:
          type: string
          maxLength: 20
          description: 전화번호
        university:
          type: string
          maxLength: 100
          description: 대학교
        major:
          type: string
          maxLength: 100
          description: 전공
        birthYear:
          type: number
          minimum: 1940
          maximum: 2020
          description: 출생연도(나이 대신 연도로 보관)
        countryCode:
          type: string
          maxLength: 8
          description: 근무 국가 코드(예 KR, GB)
        timeZone:
          type: string
          maxLength: 64
          description: IANA timezone override(예 Asia/Seoul)
      required:
      - webId
      - name
      - password
    ChangeCredentialsDto:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 72
          writeOnly: true
        newWebId:
          type: string
          minLength: 3
          maxLength: 50
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
      required:
      - currentPassword
    CredentialAccountResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 3
        webId:
          type: string
          example: ceo_owner
        name:
          type: string
          example: 김민수
        role:
          type: string
          enum:
          - super_admin
          - admin
          - manager
          - instructor
        mustChangePassword:
          type: boolean
      required:
      - id
      - webId
      - name
      - role
      - mustChangePassword
    ProfileChangeRequestResponseDto:
      type: object
      properties:
        id:
          type: number
        requesterId:
          type: number
        baseProfileVersion:
          type: number
          minimum: 1
        beforeValues:
          type: object
          additionalProperties: true
        requestedChanges:
          type: object
          additionalProperties: true
        reason:
          type: string
          minLength: 5
          maxLength: 500
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
        decidedBy:
          type: number
          nullable: true
        decidedAt:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        appliedProfileVersion:
          type: number
          nullable: true
          minimum: 2
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
      - id
      - requesterId
      - baseProfileVersion
      - beforeValues
      - requestedChanges
      - reason
      - status
      - createdAt
      - updatedAt
    CreateProfileChangeRequestDto:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
          description: 현재 비밀번호(재확인)
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: 박지훈
        email:
          type: string
          maxLength: 320
          format: email
          example: new@tnacademy.test
          description: 변경할 이메일(사전 인증 필수)
        verificationChallengeId:
          type: number
          description: 연락처(email/phone) 변경 시 소비할 verified challenge id
        phone:
          type: string
          nullable: true
          maxLength: 20
          example: +82-10-1234-5678
        countryCode:
          type: string
          nullable: true
          pattern: ^[A-Za-z][A-Za-z0-9-]{1,7}$
          example: KR
          description: '국가/권역 코드(예: KR, US-W)'
        timeZone:
          type: string
          nullable: true
          maxLength: 64
          example: Asia/Seoul
        reason:
          type: string
          minLength: 5
          maxLength: 500
          example: 업무 연락처가 변경되었습니다.
      required:
      - currentPassword
      - reason
    RejectProfileChangeRequestDto:
      type: object
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
          example: 전화번호 확인 후 다시 요청해 주세요.
      required:
      - reason
    CreateProfileVerificationDto:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
          description: 현재 비밀번호(재확인) — 저장·로그 금지
        channel:
          enum:
          - email
          - sms
          type: string
          description: 인증 채널
        target:
          type: string
          minLength: 3
          maxLength: 320
          description: 변경할 연락처(이메일 주소 또는 휴대전화 — E.164/국내형)
      required:
      - currentPassword
      - channel
      - target
    ProfileVerificationResponseDto:
      type: object
      properties:
        id:
          type: number
        channel:
          enum:
          - email
          - sms
          type: string
        maskedTarget:
          type: string
          description: '마스킹된 대상(예: pa***@t***.test, +82*****678)'
        status:
          type: string
          enum:
          - pending
          - verified
          - consumed
          - expired
          - locked
        expiresAt:
          type: string
          description: 만료 시각(ISO)
        resendAvailableAt:
          type: string
          description: 재전송 가능 시각(ISO)
        attemptsLeft:
          type: number
          description: 남은 확인 시도 횟수
      required:
      - id
      - channel
      - maskedTarget
      - status
      - expiresAt
      - resendAvailableAt
    ConfirmProfileVerificationDto:
      type: object
      properties:
        code:
          type: string
          minLength: 4
          maxLength: 10
          pattern: ^\d+$
          description: 수신한 인증 코드(6자리 숫자)
      required:
      - code
    CreateStudentDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 20
        englishName:
          type: string
          maxLength: 50
        phone:
          type: string
          maxLength: 20
        grade:
          type: number
          minimum: 1
          maximum: 12
        schoolName:
          type: string
          maxLength: 100
        residenceType:
          type: string
          enum:
          - domestic
          - overseas
        status:
          type: string
          enum:
          - lead
          - active
          - paused
          - completed
          - canceled
        country:
          type: string
          pattern: ^[A-Z]{2}$
        memo:
          type: string
          maxLength: 500
      required:
      - name
    UpdateStudentDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 20
        englishName:
          type: string
          maxLength: 50
        grade:
          type: number
          minimum: 1
          maximum: 12
        phone:
          type: string
          maxLength: 20
        country:
          type: string
          pattern: ^[A-Z]{2}$
        residenceType:
          type: string
          enum:
          - domestic
          - overseas
        status:
          type: string
          enum:
          - lead
          - active
          - paused
          - completed
          - canceled
        memo:
          type: string
          maxLength: 500
    CreateEnrollmentDto:
      type: object
      properties:
        studentId:
          type: number
        courseId:
          type: number
        roadmapId:
          type: number
        totalSessions:
          type: number
          minimum: 0
          maximum: 1000
        memo:
          type: string
          maxLength: 500
      required:
      - studentId
      - courseId
    CreatePaymentDto:
      type: object
      properties:
        studentId:
          type: number
        enrollmentId:
          type: number
        payerParentId:
          type: number
        amount:
          type: number
          minimum: 0
          maximum: 100000000
        paymentMethod:
          type: string
          enum:
          - card
          - transfer
          - cash
          - point
          - etc
        dueAt:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      required:
      - studentId
      - amount
    UpdatePaymentDto:
      type: object
      properties:
        amount:
          type: number
          minimum: 0
          maximum: 100000000
        paymentMethod:
          type: string
          enum:
          - card
          - transfer
          - cash
          - point
          - etc
        dueAt:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        memo:
          type: string
          maxLength: 500
    CreateSubjectDto:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 50
      required:
      - code
      - name
    CreateCourseDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        color:
          type: string
          maxLength: 20
        subjectId:
          type: number
        instructorId:
          type: number
        price:
          type: number
          minimum: 0
          maximum: 100000000
        hourlyRate:
          type: number
          minimum: 0
          maximum: 100000000
      required:
      - name
      - subjectId
      - instructorId
      - price
      - hourlyRate
    CreateExpenseDto:
      type: object
      properties:
        category:
          type: string
          enum:
          - supplies
          - equipment
          - books
          - rent
          - utility
          - marketing
          - meal
          - etc
        title:
          type: string
          maxLength: 100
        amount:
          type: number
          minimum: 0
          maximum: 100000000
        spentAt:
          type: string
          maxLength: 30
        vendor:
          type: string
          maxLength: 100
        memo:
          type: string
          maxLength: 500
        receiptUrl:
          type: string
          maxLength: 500
      required:
      - category
      - title
      - amount
      - spentAt
    RejectExpenseDto:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
          example: 증빙 누락 — 영수증 첨부 후 재신청
          description: 반려 사유(필수)
      required:
      - reason
    CreateRoomDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        buildingId:
          type: number
        capacity:
          type: number
          minimum: 0
        color:
          type: string
          pattern: ^#?([0-9A-F]{3}|[0-9A-F]{4}|[0-9A-F]{6}|[0-9A-F]{8})$
        isActive:
          type: boolean
      required:
      - name
    UpsertAvailabilityDto:
      type: object
      properties:
        id:
          type: number
          example: 5
          description: 수정할 블록 id(없으면 신규 생성)
        ownerType:
          enum:
          - student
          - instructor
          - room
          type: string
          example: instructor
          description: 소유 자원 종류
        ownerId:
          type: number
          example: 1
          description: 소유 자원 id(ownerType에 따라 students/users/rooms)
        kind:
          enum:
          - available
          - unavailable
          - online_only
          type: string
          example: unavailable
          description: 가용/불가/온라인만 가능(기본 available)
        weekday:
          type: number
          minimum: 0
          maximum: 6
          example: 1
          description: 요일(0=일 ~ 6=토)
        startTime:
          type: string
          example: '12:00'
          description: 시작(HH:mm)
        endTime:
          type: string
          example: '13:00'
          description: 종료(HH:mm)
        effectiveFrom:
          type: string
          maxLength: 10
          example: '2026-06-01'
          description: 적용 시작일(선택)
        effectiveTo:
          type: string
          maxLength: 10
          example: '2026-08-31'
          description: 적용 종료일(선택)
      required:
