openapi: 3.1.0
info:
  title: TACO ERP API
  version: 0.2.0-draft
  license:
    name: UNLICENSED
  description: >
    TnAcademy 백오피스(ERP) 전체 API 스펙 — **단일 소스(계획 포함)**.

    - 본 문서는 "구현 완료(implemented)" + "예정(planned, TBO-02)" 엔드포인트를 **모두** 정의합니다.
      구현 전에 payload·응답·권한을 확정해 두어 백엔드 구현과 프론트 연동이 어긋나지 않게 합니다.
    - payload/엔티티 형상의 단일 소스는 공유 계약 패키지 `@kms545487/contracts` 입니다.
      본 스펙의 schema는 그 타입을 OpenAPI로 옮긴 것이며, 구현 시 DTO(class)가 `implements` 합니다.
    - 각 operation의 `x-status`(implemented|planned)와 `x-roles`(접근 허용 역할)를 확인하세요.
    - 라이브 Swagger(구현된 부분만): `http://localhost:3001/docs` · JSON: `/docs-json`
    - 본 설계 스펙 미리보기: 이 파일을 https://editor.swagger.io 에 붙여넣기.
servers:
  - url: http://localhost:3001/api
    description: 로컬 개발(in-memory)
tags:
  - name: health
    description: 헬스체크
  - name: auth
    description: 인증(JWT 발급/검증)
  - name: users
    description: 로그인 계정(web id 검증)
  - name: students
    description: 학생 (소프트삭제=퇴원)
  - name: parents
    description: 학부모
  - name: instructors
    description: 강사
  - name: enrollments
    description: 수강등록
  - name: subjects
    description: 과목
  - name: courses
    description: 코스(시급 포함)
  - name: roadmaps
    description: 로드맵(코스·과목·강사 M:N)
  - name: class-sessions
    description: 수업/스케줄(시간대·반복)
  - name: attendance
    description: 출석
  - name: session-reports
    description: 수업 보고서(학부모 피드백)
  - name: counsel
    description: 상담(카드·회차)
  - name: payments
    description: 결제·수납(민감)
  - name: instructor-payouts
    description: 강사 페이(승인→지급)
  - name: expenses
    description: 지출·비품(승인)
  - name: academy-events
    description: 학원 이벤트/공지
  - name: transactions
    description: 통합 원장(입·출금)
  - name: dashboard
    description: 경영 지표(대표 전용)
  - name: approvals
    description: 승인 센터(집계)
  - name: rooms
    description: 강의실(스케줄 v5)
  - name: availability
    description: 가용/불가 시간(학생·강사·강의실)
  - name: scheduling
    description: 스케줄 엔진 — 충돌검사·슬롯추천·자원 스케줄·시수

security:
  - bearerAuth: []

paths:
  # ════════════════════════════ health ════════════════════════════
  /health:
    get:
      tags: [health]
      summary: 헬스체크
      operationId: health
      security: []
      x-status: implemented
      x-roles: [public]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  uptime: { type: number }

  # ════════════════════════════ auth ════════════════════════════
  /auth/token:
    post:
      tags: [auth]
      summary: 토큰 발급(데모 로그인)
      operationId: issueToken
      security: []
      x-status: implemented
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueTokenInput' }
      responses:
        '201':
          description: 발급됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  account: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [auth]
      summary: 현재 토큰의 계정/역할 조회
      operationId: getMe
      x-status: implemented
      x-roles: [any]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ════════════════════════════ users ════════════════════════════
  /users:
    get:
      tags: [users]
      summary: 계정 목록(데모 seed)
      operationId: listUsers
      x-status: implemented
      x-roles: [admin, manager, super_admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Account' } }
  /users/exists:
    get:
      tags: [users]
      summary: web id 존재 확인(학생/학부모 가입 ID 검증)
      operationId: checkWebId
      x-status: implemented
      x-roles: [any]
      parameters:
        - { name: webId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebIdCheckResult' }

  # ════════════════════════════ students ════════════════════════════
  /students:
    get:
      tags: [students]
      summary: 학생 목록(기본 스코프=활성, 퇴원 제외)
      operationId: listStudents
      x-status: implemented
      x-status-note: 'q/page/size/sort/status 필터는 planned'
      x-roles: [instructor, manager, admin, super_admin]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Sort' }
        - name: status
          in: query
          description: '특정 상태만. 미지정 시 활성(퇴원 제외).'
          schema: { $ref: '#/components/schemas/StudentStatus' }
        - name: includeDropped
          in: query
          description: 퇴원 포함 여부
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentPage' }
    post:
      tags: [students]
      summary: 학생 등록(학부모·코스 동시 등록 가능)
      operationId: createStudent
      x-status: implemented
      x-roles: [manager, admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStudentInput' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /students/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [students]
      summary: 학생 단건
      operationId: getStudent
      x-status: implemented
      x-roles: [instructor, manager, admin, super_admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [students]
      summary: 학생 정보 수정(추후 Web ID 부여 포함)
      operationId: updateStudent
      x-status: planned
      x-roles: [manager, admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStudentInput' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
  /students/{id}/drop:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [students]
      summary: 퇴원(소프트삭제) — 레코드 보존, 활성 스코프에서 제외
      description: >
        학생/수강을 status='canceled' 로 전이만 한다.
        상담·수업보고서(학점)·결제·출석·부모연결은 **삭제하지 않는다**(자산화).
      operationId: dropStudent
      x-status: planned
      x-roles: [manager, admin, super_admin]
      responses:
        '200':
          description: 퇴원 처리됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
  /students/{id}/detail:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [students]
      summary: 학생 상세(집계) — 코스·강사·상담·연락처·메모 순환 flow
      operationId: getStudentDetail
      x-status: planned
      x-roles: [instructor, manager, admin, super_admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentDetail' }

  # ════════════════════════════ parents ════════════════════════════
  /parents:
    get:
      tags: [parents]
      summary: 학부모 목록
      operationId: listParents
      x-status: planned
      x-roles: [manager, admin, super_admin]
      parameters:
        - { $ref: '#/components/parameters/Q' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Parent' } }
    post:
      tags: [parents]
      summary: 학부모 등록 + 학생 연결
      operationId: createParent
      x-status: planned
      x-roles: [manager, admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateParentInput' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Parent' }

  # ════════════════════════════ instructors ════════════════════════════
  /instructors:
    get:
      tags: [instructors]
      summary: 강사 목록
      operationId: listInstructors
      x-status: planned
      x-roles: [manager, admin, super_admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Instructor' } }

  # ════════════════════════════ enrollments ════════════════════════════
  /enrollments:
    get:
      tags: [enrollments]
      summary: 수강등록 목록
      operationId: listEnrollments
      x-status: implemented
      x-roles: [instructor, manager, admin, super_admin]
      parameters:
        - { name: studentId, in: query, schema: { type: integer } }
        - { name: courseId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Enrollment' } }
    post:
      tags: [enrollments]
      summary: 수강등록 생성
      operationId: createEnrollment
      x-status: implemented
      x-roles: [manager, admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnrollmentInput' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
  /enrollments/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [enrollments]
      summary: 수강등록 단건
      operationId: getEnrollment
      x-status: implemented
      x-roles: [instructor, manager, admin, super_admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [enrollments]
      summary: 수강 상태 변경(일시정지/수료/취소)
      operationId: updateEnrollment
      x-status: planned
      x-roles: [manager, admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/EnrollmentStatus' }
                memo: { type: string }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }

  # ════════════════════════════ subjects ════════════════════════════
  /subjects:
    get:
      tags: [subjects]
      summary: 과목 목록
      operationId: listSubjects
      x-status: implemented
      x-roles: [instructor, manager, admin, super_admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Subject' } }
    post:
      tags: [subjects]
      summary: 과목 추가
      operationId: createSubject
      x-status: implemented
      x-roles: [admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSubjectInput' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
  /subjects/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [subjects]
      summary: 과목 단건
      operationId: getSubject
      x-status: implemented
      x-roles: [instructor, manager, admin, super_admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ════════════════════════════ courses ════════════════════════════
  /courses:
    get:
      tags: [courses]
      summary: 코스 목록
      operationId: listCourses
      x-status: implemented
      x-roles: [instructor, manager, admin, super_admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Course' } }
    post:
      tags: [courses]
      summary: 코스 추가(시급 포함)
      operationId: createCourse
      x-status: implemented
      x-roles: [admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCourseInput' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
  /courses/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [courses]
      summary: 코스 단건
      operationId: getCourse
      x-status: implemented
      x-roles: [instructor, manager, admin, super_admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ════════════════════════════ roadmaps ════════════════════════════
  /roadmaps:
    get:
      tags: [roadmaps]
      summary: 로드맵 목록
      operationId: listRoadmaps
      x-status: planned
      x-roles: [manager, admin, super_admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Roadmap' } }
    post:
      tags: [roadmaps]
      summary: 로드맵 생성(코스 M:N 연결 포함)
      operationId: createRoadmap
      x-status: planned
      x-roles: [admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoadmapInput' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Roadmap' }
  /roadmaps/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [roadmaps]
      summary: 로드맵 상세(연결 코스·강사 포함)
      operationId: getRoadmap
      x-status: planned
      x-roles: [manager, admin, super_admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoadmapDetail' }
    patch:
      tags: [roadmaps]
      summary: 로드맵 수정(코스 연결/순서 변경)
      operationId: updateRoadmap
      x-status: planned
      x-roles: [admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoadmapInput' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Roadmap' }

  # ════════════════════════════ class-sessions (schedule) ════════════════════════════
  /class-sessions:
    get:
      tags: [class-sessions]
      summary: 수업/스케줄 목록(기간·필터)
      description: '캘린더 월/주 뷰용. from~to 범위 + 코스/강사/학생 필터.'
      operationId: listClassSessions
      x-status: planned
      x-roles: [student, parent, instructor, manager, admin, super_admin]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: courseId, in: query, schema: { type: integer } }
        - { name: instructorId, in: query, schema: { type: integer } }
        - { name: studentId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ClassSession' } }
    post:
      tags: [class-sessions]
      summary: 수업 단건 개설
      operationId: createClassSession
      x-status: planned
      x-roles: [manager, admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClassSessionInput' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSession' }
  /class-sessions/recurring:
    post:
      tags: [class-sessions]
      summary: 기간·요일 반복 수업 생성(시리즈)
      description: '생성된 수업들은 동일 seriesId 로 묶인다(시리즈 편집용).'
      operationId: createRecurringClassSessions
      x-status: planned
      x-roles: [manager, admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRecurringInput' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  seriesId: { type: integer }
                  created: { type: integer, description: 생성된 수업 수 }
                  sessions: { type: array, items: { $ref: '#/components/schemas/ClassSession' } }
  /class-sessions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [class-sessions]
      summary: 수업 단건
      operationId: getClassSession
      x-status: planned
      x-roles: [student, parent, instructor, manager, admin, super_admin]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClassSession' }
    patch:
      tags: [class-sessions]
      summary: 수업 수정(시간·주제 등). 시리즈 범위 지정 가능
      description: >
        시간/요일 변경 시 `scope` 로 적용 범위를 정한다(구글 캘린더식).
        관련 출석·보고서 Join 은 sessionId 기준이라 그대로 유지되며,
        강사 페이/대시보드 등 파생값은 서버에서 재계산한다.
      operationId: updateClassSession
      x-status: planned
      x-roles: [manager, admin, super_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClassSessionInput' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  affected: { type: integer, description: 변경된 수업 수 }
                  sessions: { type: array, items: { $ref: '#/components/schemas/ClassSession' } }
    delete:
      tags: [class-sessions]
      summary: 수업 삭제/취소(시리즈 범위 지정 가능)
