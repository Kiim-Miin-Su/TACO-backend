info:
  title: TACO ERP API
  description: TnAcademy 백오피스 운영 API. Postgres 영속 저장소와 역할 기반 접근 제어를 사용하는 실제 서비스 계약.
  version: 1.0.0
  contact: {}
tags: []
servers:
  - url: /
    description: 현재 호스트
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
    access_token:
      type: apiKey
      in: cookie
      name: access_token
  schemas:
    CreateSignupEmailChallengeDto:
      type: object
      properties:
        email:
          type: string
          maxLength: 320
          format: email
          example: applicant@example.com
          description: 가입에 사용할 이메일(소유 인증 대상)
      required:
        - email
    ConfirmSignupEmailChallengeDto:
      type: object
      properties:
        email:
          type: string
          maxLength: 320
          format: email
          example: applicant@example.com
          description: 발송을 요청한 이메일(일치 필수)
        code:
          type: string
          minLength: 4
          maxLength: 10
          pattern: ^\d+$
          description: 수신한 인증 코드(6자리 숫자)
      required:
        - email
        - code
    CreateSignupPhoneChallengeDto:
      type: object
      properties:
        phone:
          type: string
          minLength: 9
          maxLength: 20
          pattern: ^[\d+\-\s]+$
          example: 010-1234-5678
          description: 가입에 사용할 휴대전화(소유 인증 대상)
      required:
        - phone
    ConfirmSignupPhoneChallengeDto:
      type: object
      properties:
        phone:
          type: string
          minLength: 9
          maxLength: 20
          pattern: ^[\d+\-\s]+$
          example: 010-1234-5678
          description: 발송을 요청한 휴대전화(일치 필수)
        code:
          type: string
          minLength: 4
          maxLength: 10
          pattern: ^\d+$
          description: 수신한 인증 코드(6자리 숫자)
      required:
        - phone
        - code
    SignupDto:
      type: object
      properties:
        webId:
          type: string
          minLength: 3
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 100
        rrn:
          type: string
        emailChallengeId:
          type: number
        phoneChallengeId:
          type: number
        role:
          type: string
          enum:
            - instructor
            - manager
            - admin
        phone:
          type: string
          pattern: ^\d{2,3}-\d{3,4}-\d{4}$
        university:
          type: string
          maxLength: 100
        major:
          type: string
          maxLength: 100
      required:
        - webId
        - name
        - email
        - password
        - rrn
        - emailChallengeId
    LoginDto:
      type: object
      properties:
        webId:
          type: string
          maxLength: 50
        password:
          type: string
          maxLength: 100
      required:
        - webId
    LoginAccountResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 3
        name:
          type: string
          example: 김민수
        role:
          enum:
            - super_admin
            - admin
            - manager
            - instructor
          type: string
        mustChangePassword:
          type: boolean
          description: true면 계정 보안 변경 외 업무 API가 차단된다.
      required:
        - id
        - name
        - role
        - mustChangePassword
    LoginResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: Bearer access token. test/non-production 호환 응답이며 production에서는 HttpOnly cookie만 사용.
        account:
          $ref: '#/components/schemas/LoginAccountResponseDto'
      required:
        - account
    RecoverIdDto:
      type: object
      properties:
        email:
          type: string
          maxLength: 255
          format: email
          example: staff@tnacademy.test
          description: 가입 이메일 — 일치하면 아이디를 메일로 안내
      required:
        - email
    RecoverPasswordDto:
      type: object
      properties:
        webId:
          type: string
          minLength: 1
          maxLength: 50
          example: staff01
          description: 아이디
        email:
          type: string
          maxLength: 255
          format: email
          example: staff@tnacademy.test
          description: 가입 이메일 — 아이디와 함께 일치해야 발송
      required:
        - webId
        - email
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 128
          description: 메일로 받은 재설정 토큰
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
      required:
        - token
        - newPassword
    CompleteRecoverIdDto:
      type: object
      properties:
        challengeId:
          type: number
          minimum: 1
          description: 인증 완료된 recovery challenge id
        email:
          type: string
          maxLength: 320
          format: email
          example: staff@tnacademy.test
          description: 인증한 이메일(일치 필수)
      required:
        - challengeId
        - email
    ResetPasswordOtpDto:
      type: object
      properties:
        challengeId:
          type: number
          minimum: 1
          description: 인증 완료된 recovery challenge id
        webId:
          type: string
          minLength: 1
          maxLength: 50
          example: staff01
          description: 아이디 — 이메일과 함께 일치해야 변경
        email:
          type: string
          maxLength: 320
          format: email
          example: staff@tnacademy.test
          description: 인증한 이메일(일치 필수)
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: 새 비밀번호(8~72바이트)
      required:
        - challengeId
        - webId
        - email
        - newPassword
    ReauthDto:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
          writeOnly: true
          description: 현재 비밀번호
      required:
        - currentPassword
    StaffAccountResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 1
        webId:
          type: string
          example: manager01
        name:
          type: string
          example: 이지원
        email:
          type: string
          nullable: true
          example: manager@tnacademy.test
        phone:
          type: string
          nullable: true
          example: 010-1234-5678
        role:
          enum:
            - instructor
            - manager
            - admin
            - super_admin
          type: string
        status:
          enum:
            - pending
            - active
            - rejected
          type: string
        emailVerified:
          type: boolean
          example: true
        profileVersion:
          type: number
          example: 1
          minimum: 1
        countryCode:
          type: string
          nullable: true
          example: KR
        timeZone:
          type: string
          nullable: true
          example: Asia/Seoul
        university:
          type: string
          nullable: true
          example: 서울대학교
        major:
          type: string
          nullable: true
          example: 수학교육
        birthYear:
          type: number
          nullable: true
          example: 1992
        rrnMasked:
          type: string
          nullable: true
          example: 199201-1******
          description: 대표 상세·승인 조회에서만 제공
        createdAt:
          type: string
          example: '2026-07-29T00:00:00.000Z'
        updatedAt:
          type: string
          example: '2026-07-29T00:00:00.000Z'
        deletedAt:
          type: string
          nullable: true
          example: null
      required:
        - id
        - webId
        - name
        - role
        - status
        - emailVerified
        - profileVersion
        - createdAt
        - updatedAt
    ApproveDto:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
    RejectDto:
      type: object
      properties:
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: 반려 사유(필수) — audit_log에 기록
      required:
        - reason
    ProfileResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 1
        webId:
          type: string
          example: instructor01
        name:
          type: string
          example: 박지훈
        email:
          type: string
          nullable: true
          example: park@tnacademy.test
        phone:
          type: string
          nullable: true
          example: +82-10-1234-5678
        countryCode:
          type: string
          nullable: true
          example: KR
        timeZone:
          type: string
          nullable: true
          example: Asia/Seoul
        role:
          enum:
            - instructor
            - manager
            - admin
            - super_admin
          type: string
        status:
          enum:
            - pending
            - active
            - rejected
          type: string
        emailVerified:
          type: boolean
          example: true
          description: 이메일 인증 완료 여부(가입 OTP 또는 잔존 링크 인증)
        profileVersion:
          type: number
          example: 1
          minimum: 1
        smsVerificationAvailable:
          type: boolean
          example: false
          description: SMS 인증 가용(provider env 완비) — phone 변경 스테퍼 동적 활성
      required:
        - id
        - webId
        - name
        - role
        - status
        - emailVerified
        - profileVersion
        - smsVerificationAvailable
    CreateInstructorDto:
      type: object
      properties:
        role:
          enum:
            - instructor
            - manager
            - admin
          type: string
          description: 역할(기본 instructor)
        webId:
          type: string
          minLength: 3
          maxLength: 50
          description: 로그인 아이디
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 이름
        password:
          type: string
          minLength: 8
          maxLength: 100
          description: 초기 비밀번호(8자+)
        email:
          type: string
          format: email
          description: 이메일(선택)
        phone:
          type: string
          maxLength: 20
          description: 전화번호
        university:
          type: string
          maxLength: 100
          description: 대학교
        major:
          type: string
          maxLength: 100
          description: 전공
        birthYear:
          type: number
          minimum: 1940
          maximum: 2020
          description: 출생연도(나이 대신 연도로 보관)
        countryCode:
          type: string
          maxLength: 8
          description: 근무 국가 코드(예 KR, GB)
        timeZone:
          type: string
          maxLength: 64
          description: IANA timezone override(예 Asia/Seoul)
        defaultHourlyRate:
          type: number
          minimum: 0
          maximum: 100000000
          description: 강사별 기본 시급(원)
        canTeachKinder:
          type: boolean
          description: Kinder 수업 가능 여부
      required:
        - webId
        - name
        - password
    SetUserCapabilityDto:
      type: object
      properties:
        mode:
          enum:
            - allow
            - deny
            - default
          type: string
          description: allow/deny 사용자 예외 또는 role 기본값 복원
        reason:
          type: string
          minLength: 5
          maxLength: 200
          description: 감사 이력에 남길 변경 사유
        expectedAccessVersion:
          type: number
          minimum: 1
          description: 권한 화면을 읽었을 때의 대상 auth/access version
      required:
        - mode
        - reason
        - expectedAccessVersion
    AdminUpdateUserDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          description: 이름
        phone:
          type: string
          pattern: ^01[016789]-?\d{3,4}-?\d{4}$
          description: 전화번호(010-1234-5678)
        email:
          type: string
          maxLength: 255
          format: email
          description: 이메일 — 변경 시 기존 세션 전부 무효(auth_version+1)
        role:
          enum:
            - instructor
            - manager
            - admin
          type: string
          description: 역할 — 변경 시 기존 세션 전부 무효
    UserLifecycleDto:
      type: object
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 2000
      required:
        - reason
    UpdateInstructorDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
        university:
          type: string
          nullable: true
          maxLength: 100
        major:
          type: string
          nullable: true
          maxLength: 100
        birthYear:
          type: number
          nullable: true
          minimum: 1940
          maximum: 2020
        countryCode:
          type: string
          nullable: true
          maxLength: 8
        timeZone:
          type: string
          nullable: true
          maxLength: 64
        defaultHourlyRate:
          type: number
          minimum: 0
          maximum: 100000000
        canTeachKinder:
          type: boolean
    ChangeCredentialsDto:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 72
          writeOnly: true
        newWebId:
          type: string
          minLength: 3
          maxLength: 50
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
        verificationChallengeId:
          type: number
          description: 비밀번호 변경 시 소비할 본인 이메일 verified challenge id(평시 필수)
        name:
          type: string
          minLength: 1
          maxLength: 50
        email:
          type: string
          maxLength: 320
          format: email
        phone:
          type: string
          pattern: ^\d{2,3}-\d{3,4}-\d{4}$
          example: 010-1234-5678
        countryCode:
          type: string
          pattern: ^[A-Z][A-Z0-9-]{1,7}$
          example: KR
          description: 국가 코드(catalog/countries)
        timeZone:
          type: string
          maxLength: 50
          example: Asia/Seoul
          description: IANA 시간대(catalog/countries)
        university:
          type: string
          maxLength: 100
          description: 출신 대학
        major:
          type: string
          maxLength: 100
          description: 전공
        birthYear:
          type: number
          minimum: 1900
          maximum: 2100
          example: 1990
          description: 출생연도
      required:
        - currentPassword
    CredentialAccountResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 3
        webId:
          type: string
          example: ceo_owner
        name:
          type: string
          example: 김민수
        role:
          type: string
          enum:
            - super_admin
            - admin
            - manager
            - instructor
        mustChangePassword:
          type: boolean
      required:
        - id
        - webId
        - name
        - role
        - mustChangePassword
    CreateProfileVerificationDto:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 72
